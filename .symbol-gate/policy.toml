labels = []

[[extractors]]
id = "rust"
language = "rust"
preset = "rust-analyzer-scip"
protocol = "scip"
command = [
    "rust-analyzer",
    "scip",
    ".",
    "--output",
    ".symbol-gate/work/rust.scip",
]
version_command = [
    "rust-analyzer",
    "--version",
]
pinned_version = "rust-analyzer 1.90.0 (1159e78c 2025-09-14)"
output_path = ".symbol-gate/work/rust.scip"
claims = ["**/*.rs"]
timeout_secs = 900
unindexed_files = "fail"

[symbol_kinds]
included = [
    "class",
    "constant",
    "constructor",
    "enum",
    "enum_variant",
    "field",
    "function",
    "interface",
    "macro",
    "method",
    "module",
    "namespace",
    "package",
    "parameter",
    "property",
    "repository",
    "static",
    "struct",
    "trait",
    "type_alias",
    "union",
]
