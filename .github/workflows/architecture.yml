name: Architecture

# Every gate `AGENTS.md` names for an architectural or public-API change, run on
# every pull request and every push to main. Until 2026-08-23 this workflow ran
# one job — the vocabulary checker — and nothing compiled, tested, or linted the
# workspace in CI at all.
#
# Not covered here, and deliberately named rather than silently omitted:
#
#   * The canary SCENARIO corpus (`apps/canary/scenarios.json`: 28 enabled
#     scenarios plus one reconnaissance scenario). Every one of them starts a
#     real third-party relay process and fails closed when the prerequisite is
#     missing — they never skip. `lab-real-relay-smoke` and the M1-M7 scenarios
#     need the pinned `nostr-rs-relay` 0.8.12 executable; the two
#     `croissant-*-public-flow` scenarios additionally need a local Croissant
#     source checkout and a sealed, attested Fava build produced by
#     `launch-croissant-simple-groups`. `public-relay-recon` reaches a public
#     relay over the network. None of that is reproducible on a hosted runner,
#     so scenario evidence stays a local, operator-run gate. What CI does run is
#     the canary's own Rust test corpus and `canary list`, which proves the
#     scenario registry parses and the binary builds.
#   * `bazel test //...`, `--config=clippy`, and `--config=fmt-check`. `.bazelrc`
#     calls Bazel the authoritative build; it is not yet wired into CI and needs
#     a runner cache strategy first.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  vocabulary:
    name: Architectural vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test architectural vocabulary gate
        run: python3 -m unittest tools/tests/test_vocabulary_check.py
      # AGENTS.md: "Architectural vocabulary is closed by default." This gate is
      # red on purpose while the ownership remediation runs; the violation list
      # is the work queue, not a flake. Do not silence it by widening
      # `docs/internals/vocabulary.toml` — the unapproved lifecycle owners it
      # names are scheduled for deletion.
      - name: Check architectural vocabulary
        run: python3 tools/check_vocabulary.py

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # The three live-query ownership falsifiers imported in `af2097a`. They
      # encode the Wave 3 / Phase 07.6 target architecture — relay-independent
      # local observation, shared relay work across equivalent observations, and
      # exact cancellation of provisional relay work — and they are RED on
      # purpose until 07.6 delivers it. They are not deleted, not weakened, and
      # not `#[ignore]`d: an ignored test proves nothing and stops reporting.
      #
      # CI splits the corpus around them instead, so the expectation is
      # falsifiable in both directions:
      #
      #   * the main run skips exactly these three, so every other test in the
      #     workspace still gates the merge and any genuine regression is red;
      #   * the second step runs exactly these three and requires the run to
      #     report `0 passed; 3 failed`. If one starts passing, the count no
      #     longer matches and the job fails loudly — which is the signal to
      #     promote it out of this list, not to widen the list.
      #
      # Renaming or deleting one of the three also fails: the skip stops
      # matching (main run turns red) and the filtered run reports a different
      # count (second step turns red).
      EXPECTED_RED_UNTIL_07_6: >-
        relay_establishment_does_not_delay_the_coherent_local_observation
        equivalent_observations_share_relay_work_until_the_last_handle_closes
        cancelling_observe_while_another_relay_opens_closes_provisional_work
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: |
          set -euo pipefail
          skip=()
          for name in $EXPECTED_RED_UNTIL_07_6; do
            skip+=(--skip "$name")
          done
          cargo test --workspace --all-targets --locked -- "${skip[@]}"
      - name: Assert the Phase 07.6 falsifiers are still red
        run: |
          set -euo pipefail
          names=($EXPECTED_RED_UNTIL_07_6)
          expected="test result: FAILED. 0 passed; ${#names[@]} failed"
          output=$(cargo test --locked --package fava --test explicit_live \
            -- --exact "${names[@]}" 2>&1) || true
          echo "$output"
          if ! printf '%s' "$output" | grep -qF "$expected"; then
            echo "::error::expected '$expected' from the Phase 07.6 falsifiers." >&2
            echo "If one now passes, Phase 07.6 landed for it: remove it from" >&2
            echo "EXPECTED_RED_UNTIL_07_6 so the main run gates it from now on." >&2
            exit 1
          fi
      # `--all-targets` skips doctests; the public API examples are behavioral
      # evidence too.
      - name: Test workspace doctests
        run: cargo test --workspace --doc --locked

  clippy:
    name: Clippy and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The strictness the repository already agreed to and records in
      # docs/issues/0001, 0003, and 0018: warnings are errors, across every
      # target, with `clippy::all` and `clippy::pedantic` warned on in
      # Cargo.toml `[workspace.lints]`.
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy canary
        run: cargo clippy --manifest-path apps/canary/Cargo.toml --all-targets --locked -- -D warnings
      # Both falsifier lock files are current and both are checked with
      # `--locked`, so dependency drift in a standalone falsifier workspace is a
      # CI failure rather than a silent re-resolve. Do not drop `--locked` to get
      # past a stale lock: regenerate the lock, because a stale one means the
      # falsifier is no longer proving what the workspace actually depends on.
      - name: Clippy external null-cache falsifier
        run: cargo clippy --manifest-path falsifiers/external-null-cache/Cargo.toml --all-targets --locked -- -D warnings
      - name: Clippy external semantic-capability falsifier
        run: cargo clippy --manifest-path falsifiers/external-semantic-capability/Cargo.toml --all-targets --locked -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check

  falsifiers:
    name: External falsifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      # Both falsifier packages are standalone workspaces that consume Fava only
      # through its public contracts, so they are the replaceability proof and
      # they run headless with no relay and no network.
      - name: External null-cache proof
        run: cargo test --manifest-path falsifiers/external-null-cache/Cargo.toml --all-targets --locked
      - name: External semantic-capability proof
        run: cargo test --manifest-path falsifiers/external-semantic-capability/Cargo.toml --all-targets --locked

  canary:
    name: Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      # The canary is a separate workspace, so `cargo test --workspace` above
      # never reaches it. Its own Rust corpus runs headless.
      - name: Test canary
        run: cargo test --manifest-path apps/canary/Cargo.toml --all-targets --locked
      - name: Test canary tooling
        run: python3 -m unittest discover --start-directory apps/canary/tools --pattern "test_*.py"
      # Proves the scenario registry parses and the executable builds. Running a
      # scenario needs a real relay process; see the note at the top of this
      # file.
      - name: List canary scenarios
        run: cargo run --quiet --manifest-path apps/canary/Cargo.toml --locked -- list

  file-size:
    name: File size limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # AGENTS.md "Rust conventions": no code file may cross 800 lines.
      - name: Refuse code files over the hard limit
        run: |
          set -euo pipefail
          over=$(find crates apps falsifiers -name '*.rs' -type f -exec awk 'END { if (FNR >= 800) print FILENAME ":" FNR }' {} \;)
          if [ -n "$over" ]; then
            echo "code files past the 800-line hard limit:" >&2
            echo "$over" >&2
            exit 1
          fi
