name: Architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check architectural vocabulary
        run: python3 tools/check_vocabulary.py
      - name: Test architectural vocabulary gate
        run: python3 -m unittest tools/tests/test_vocabulary_check.py
