# Publish the whole surface for signing.
#
# The verify workflow reports on a change: a pull request comment quotes the few
# declarations that changed, and a reviewer signs them in place. That shape does
# not survive a repository signing its surface for the first time. fava's
# unsigned payload is 233 KB against a comment's practical 60 KB, and there is
# no pull request to comment on.
#
# So this writes the payload to a branch and opens one pull request whose body is
# a link. The branch exists to give the payload a commit to be read at; the pull
# request exists to give the link somewhere to live and to be closed when the
# work is done.
#
# Run it from the Actions tab. It is deliberately not automatic: it force-pushes
# a branch, and a repository that already signs its surface on every pull request
# never needs it.
name: Symbol Gate surface

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to publish the payload on"
        required: false
        default: "symbol-gate/surface"

permissions:
  # To push the payload branch.
  contents: write
  # To open the pull request that carries the link.
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
      BRANCH: ${{ inputs.branch || 'symbol-gate/surface' }}
      # The renderer that verifies has to be the renderer that signed, and a
      # version number does not say which: symbol-gate does not bump versions.
      SG_REV: "9112c668e891b358fd8a0becaf41653b33328ae5"
      PAYLOAD: .symbol-gate/unsigned.json
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned indexer toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-analyzer

      - name: Install symbol-gate
        run: |
          cargo install symbol-gate \
            --git https://github.com/pablof7z/symbol-gate \
            --rev "$SG_REV" --locked --root "$RUNNER_TEMP/tools"

      - name: Write the payload
        env:
          SG: ${{ runner.temp }}/tools/bin/symbol-gate
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          OUT: .symbol-gate/unsigned.json
        run: .github/scripts/symbol-gate-surface-payload.sh

      # The branch carries the payload and nothing else, and is replaced each
      # run: it is a pointer to the current surface, not a history of it.
      - name: Publish the payload branch
        id: publish
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -f "$PAYLOAD"
          git commit -m "Publish the unsigned surface for signing" --quiet
          git push --force origin "$BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "total=$(jq -r '.total' "$PAYLOAD")" >> "$GITHUB_OUTPUT"

      - name: Open or update the signing pull request
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.publish.outputs.commit }}
          TOTAL: ${{ steps.publish.outputs.total }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -eu
          link="https://sign.f7z.io/?repo=$(printf %s "$REPO_URL" | jq -sRr @uri)"
          link="$link&commit=$COMMIT&file=$(printf %s "$PAYLOAD" | jq -sRr @uri)"

          body=$(printf '%s\n' \
            "### Symbol Gate: sign the declared surface" \
            "" \
            "$TOTAL declaration(s) in this repository carry no signature." \
            "" \
            "[Review and sign them]($link)" \
            "" \
            "The page reads \`$PAYLOAD\` at commit \`$COMMIT\`, shows each declaration," \
            "and signs with your Nostr extension. Commit the events it gives you under" \
            "\`.symbol-gate/approved/\`." \
            "" \
            "Anyone can edit this pull request and it changes nothing: \`symbol-gate verify\`" \
            "re-renders every declaration from source, so a signature over text that is not" \
            "a real declaration matches nothing and the gate stays red." \
            "" \
            "Close this pull request when the surface is signed; do not merge it. The branch" \
            "carries a generated payload, not a change to the repository.")

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
            echo "updated pull request #$existing"
          else
            gh pr create --head "$BRANCH" --title "Symbol Gate: sign the declared surface" --body "$body"
          fi
