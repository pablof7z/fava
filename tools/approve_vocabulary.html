<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fava vocabulary approval</title>
<style>
  :root { color-scheme: dark; --line: #2a2a2e; --dim: #8a8a94; }
  body { margin: 0; font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0e0e10; color: #e6e6ea; }
  header { position: sticky; top: 0; background: #0e0e10; border-bottom: 1px solid var(--line);
           padding: 16px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #identity { color: var(--dim); font-size: 12px; }
  #identity.ok { color: #4ade80; }
  #identity.bad { color: #f87171; }
  input[type=search] { background: #17171b; border: 1px solid var(--line); color: inherit;
                       padding: 6px 10px; border-radius: 6px; font: inherit; min-width: 220px; }
  button { background: #17171b; border: 1px solid var(--line); color: inherit; font: inherit;
           padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #4a4a52; }
  button:disabled { opacity: .4; cursor: default; }
  main { padding: 16px 24px 64px; }
  .counts { color: var(--dim); font-size: 12px; margin-left: auto; }
  .term { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }
  .term > summary { padding: 10px 14px; cursor: pointer; display: flex; gap: 12px;
                    align-items: center; list-style: none; }
  .term > summary::-webkit-details-marker { display: none; }
  .name { font-weight: 600; }
  .owner { color: var(--dim); font-size: 12px; }
  .summary-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .summary-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .summary-title .name { font-size: 15px; }
  .rust-kind { color: #93c5fd; font-size: 12px; }
  .rust-item-path { color: #6e6e77; font-size: 11px; max-width: min(44ch, 54vw);
    white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  .purpose { color: #d4d4dd; font-size: 12px; white-space: nowrap; text-overflow: ellipsis;
             overflow: hidden; max-width: min(62ch, 60vw); }
  .summary-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .candidate-label { color: #93c5fd; font-size: 11px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid; }
  .approved { color: #4ade80; border-color: #1e5b39; }
  .unapproved { color: #f0a24a; border-color: #6b4520; }
  .stale, .invalid { color: #f87171; border-color: #6b2020; }
  .blocked { color: #c084fc; border-color: #6b3a86; }
  .missing, .misfiled { color: #f472b6; border-color: #701a4f; }
  .body { padding: 0 14px 14px; }
  .markdown { background: #131317; border: 1px solid var(--line); border-radius: 6px;
              margin: 0 0 10px; padding: 12px 18px; overflow-wrap: anywhere; }
  .markdown h1, .markdown h2, .markdown h3 { margin: 1em 0 .45em; line-height: 1.25; }
  .markdown h1:first-child { margin-top: 0; }
  .markdown h1 { font-size: 20px; }
  .markdown h2 { font-size: 16px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
  .markdown h3 { font-size: 14px; }
  .markdown p { margin: .55em 0; }
  .markdown ul { margin: .55em 0; padding-left: 24px; }
  .markdown pre, .payload { background: #0e0e10; border: 1px solid var(--line); border-radius: 5px;
                            padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .markdown code { color: #bfdbfe; }
  .exact-payload { margin: 0 0 10px; color: var(--dim); }
  .exact-payload > summary { cursor: pointer; margin-bottom: 8px; }
  .payload { margin: 0; color: #e6e6ea; }
  .row { display: flex; gap: 10px; align-items: center; }
  .error { color: #f87171; font-size: 12px; }
  #problems { color: #f87171; font-size: 12px; margin-bottom: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Fava vocabulary approval</h1>
  <span id="identity">signer not connected</span>
  <input type="search" id="filter" placeholder="filter terms" autocomplete="off">
  <button id="connect">Connect signer</button>
  <span class="counts" id="counts"></span>
</header>
<main>
  <div id="problems"></div>
  <div id="terms"></div>
</main>
<script>
const OWNER = "fa984bd7dbb282f07e16e7ae87b26a2a7b9b90b7246a44771f0cf5ae58018f52";
const KIND = 9999;
let terms = [];
let signerReady = false;
const review = new URLSearchParams(window.location.search);
const ownerFilter = review.get("owner") || "";
const statusFilter = review.get("status") || "";
document.getElementById("filter").value = review.get("filter") || "";

function matchesStatus(term) {
  if (!statusFilter) return true;
  if (statusFilter === "pending") {
    return term.status === "unapproved" || term.status === "stale";
  }
  return term.status === statusFilter;
}

async function waitForNostr(timeoutMs = 10000) {
  const deadline = Date.now() + timeoutMs;
  while (!window.nostr && Date.now() < deadline) {
    await new Promise((resolve) => setTimeout(resolve, 100));
  }
  return window.nostr;
}

async function connect() {
  const identity = document.getElementById("identity");
  const connectButton = document.getElementById("connect");
  connectButton.disabled = true;
  identity.textContent = "waiting for NIP-07…";
  identity.className = "";
  const nostr = await waitForNostr();
  if (!nostr) {
    identity.textContent = "no NIP-07 extension found — retry after unlocking it";
    identity.className = "bad";
    connectButton.disabled = false;
    return;
  }
  try {
    const pubkey = await nostr.getPublicKey();
    if (pubkey !== OWNER) {
      identity.textContent = `wrong key: ${pubkey.slice(0, 16)}…`;
      identity.className = "bad";
      connectButton.disabled = false;
      return;
    }
    identity.textContent = `signing as ${OWNER.slice(0, 16)}…`;
    identity.className = "ok";
    signerReady = true;
    connectButton.textContent = "Signer connected";
    render();
  } catch (error) {
    identity.textContent = `NIP-07 refused: ${error.message}`;
    identity.className = "bad";
    connectButton.disabled = false;
  }
}

async function load() {
  const response = await fetch("/api/terms");
  const payload = await response.json();
  terms = payload.terms;
  document.getElementById("problems").textContent = payload.problems.join("\n");
  render();
}

function appendInlineMarkdown(parent, text) {
  const pattern = /(`[^`]*`|\*\*[^*]+\*\*)/g;
  let cursor = 0;
  for (const match of text.matchAll(pattern)) {
    parent.append(document.createTextNode(text.slice(cursor, match.index)));
    const token = match[0];
    const element = document.createElement(token.startsWith("`") ? "code" : "strong");
    element.textContent = token.startsWith("`") ? token.slice(1, -1) : token.slice(2, -2);
    parent.append(element);
    cursor = match.index + token.length;
  }
  parent.append(document.createTextNode(text.slice(cursor)));
}

function renderMarkdown(markdown) {
  const rendered = document.createElement("div");
  rendered.className = "markdown";
  const lines = markdown.replace(/\r\n/g, "\n").split("\n");
  let paragraph = [];
  let list = null;
  let fence = null;

  const flushParagraph = () => {
    if (!paragraph.length) return;
    const element = document.createElement("p");
    appendInlineMarkdown(element, paragraph.join(" "));
    rendered.append(element);
    paragraph = [];
  };
  const flushList = () => {
    if (!list) return;
    rendered.append(list);
    list = null;
  };
  const flushFence = () => {
    if (!fence) return;
    const pre = document.createElement("pre");
    const code = document.createElement("code");
    if (fence.language) code.className = `language-${fence.language}`;
    code.textContent = fence.lines.join("\n");
    pre.append(code);
    rendered.append(pre);
    fence = null;
  };

  for (const line of lines) {
    if (fence) {
      if (line.startsWith("```")) flushFence();
      else fence.lines.push(line);
      continue;
    }
    const fenceStart = line.match(/^```\s*([^\s]*)/);
    if (fenceStart) {
      flushParagraph();
      flushList();
      fence = { language: fenceStart[1], lines: [] };
      continue;
    }
    const heading = line.match(/^(#{1,3})\s+(.+)$/);
    if (heading) {
      flushParagraph();
      flushList();
      const element = document.createElement(`h${heading[1].length}`);
      appendInlineMarkdown(element, heading[2]);
      rendered.append(element);
      continue;
    }
    const item = line.match(/^\s*-\s+(.+)$/);
    if (item) {
      flushParagraph();
      if (!list) list = document.createElement("ul");
      const element = document.createElement("li");
      appendInlineMarkdown(element, item[1]);
      list.append(element);
      continue;
    }
    if (!line.trim()) {
      flushParagraph();
      flushList();
      continue;
    }
    flushList();
    paragraph.push(line.trim());
  }
  flushParagraph();
  flushList();
  flushFence();
  return rendered;
}

function splitReviewMarkdown(markdown) {
  const marker = "## Governance metadata";
  const offset = markdown.indexOf(marker);
  if (offset < 0) return { primary: markdown, secondary: "" };
  return {
    primary: markdown.slice(0, offset).trimEnd() + "\n",
    secondary: markdown.slice(offset),
  };
}

function render() {
  const needle = document.getElementById("filter").value.toLowerCase();
  const visible = terms.filter((term) =>
    term.name.toLowerCase().includes(needle) &&
    (!ownerFilter || term.owner === ownerFilter) &&
    matchesStatus(term)
  );
  const counts = visible.reduce((totals, term) => {
    totals[term.status] = (totals[term.status] || 0) + 1;
    return totals;
  }, {});
  const candidateCount = visible.filter((term) => term.candidate).length;
  document.getElementById("counts").textContent =
    `${visible.length} shown · ${candidateCount} candidates · ` +
    `${counts.approved || 0} approved · ` +
    `${counts.unapproved || 0} unsigned · ` +
    `${counts.blocked || 0} blocked unsigned · ` +
    `${counts.invalid || 0} invalid parents · ${counts.missing || 0} missing terms · ` +
    `${counts.misfiled || 0} misfiled · ${counts.stale || 0} stale`;

  const container = document.getElementById("terms");
  container.replaceChildren();
  for (const term of visible) {
    const details = document.createElement("details");
    details.className = "term";

    const summary = document.createElement("summary");
    const summaryMain = document.createElement("div");
    summaryMain.className = "summary-main";

    const title = document.createElement("div");
    title.className = "summary-title";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = term.name;
    const badge = document.createElement("span");
    badge.className = `badge ${term.status}`;
    badge.textContent = term.status;
    const rustKind = document.createElement("span");
    rustKind.className = "rust-kind";
    rustKind.textContent = term.rust_item_kind || "non-Rust Concept";
    rustKind.title = `Rust item kind: ${rustKind.textContent}`;
    const rustItem = document.createElement("span");
    rustItem.className = "rust-item-path";
    rustItem.textContent = term.rust_item || "";
    rustItem.title = `Rust item: ${rustItem.textContent || "untyped"}`;
    const purpose = document.createElement("div");
    purpose.className = "purpose";
    purpose.textContent = term.purpose || "";
    const purposeText = term.purpose || "";
    purpose.title = purposeText;
    title.append(badge, name, rustKind, rustItem);
    if (term.candidate) {
      const candidateLabel = document.createElement("span");
      candidateLabel.className = "candidate-label";
      candidateLabel.textContent = term.proposed_disposition;
      title.append(candidateLabel);
    }
    summaryMain.append(title, purpose);
    summary.append(summaryMain);

    const owner = document.createElement("span");
    owner.className = "owner";
    owner.textContent = term.owner;

    const body = document.createElement("div");
    body.className = "body";
    const reviewSections = splitReviewMarkdown(term.markdown);
    const renderedPayload = renderMarkdown(reviewSections.primary);
    const secondaryPayload = document.createElement("details");
    secondaryPayload.className = "exact-payload";
    const secondarySummary = document.createElement("summary");
    secondarySummary.textContent = "Governance and exact machine payload";
    secondaryPayload.append(secondarySummary, renderMarkdown(reviewSections.secondary));
    const rawPayload = document.createElement("details");
    rawPayload.className = "exact-payload";
    const rawSummary = document.createElement("summary");
    rawSummary.textContent = "Exact signed Markdown (raw)";
    const payload = document.createElement("pre");
    payload.className = "payload";
    payload.textContent = term.markdown;
    rawPayload.append(rawSummary, payload);
    const actions = document.createElement("span");
    actions.className = "summary-actions";
    const button = document.createElement("button");
    const signable = !["blocked", "invalid", "missing", "misfiled"].includes(term.status);
    button.textContent = term.status === "approved" ? "Re-sign" :
      signable ? "Sign approval" : "Cannot sign";
    button.disabled = !signerReady || !signable;
    const status = document.createElement("span");
    status.className = "error";
    button.addEventListener("click", async () => {
      if (!signable) return;
      button.disabled = true;
      status.textContent = "signing…";
      try {
        await approve(term);
        status.textContent = "";
        await load();
      } catch (error) {
        status.textContent = error.message;
        button.disabled = false;
      }
    });
    actions.append(button, status);
    body.append(renderedPayload, secondaryPayload, rawPayload, actions);

    summary.append(owner);
    details.append(summary, body);
    container.append(details);
  }
}

async function approve(term) {
  const event = await window.nostr.signEvent({
    kind: KIND,
    created_at: Math.floor(Date.now() / 1000),
    tags: [["name", term.name]],
    content: term.markdown,
  });
  const response = await fetch("/api/approvals", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(event),
  });
  if (!response.ok) {
    const payload = await response.json();
    throw new Error(payload.error || `rejected (${response.status})`);
  }
}

document.getElementById("filter").addEventListener("input", render);
connect().then(load);
</script>
</body>
</html>
