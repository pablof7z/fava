# Fava vocabulary. Each term documents why protocol vocabulary alone is not
# enough.

[[term]]
name = "Fava"
source = "fava"
meaning = "One assembled Fava engine instance and its public facade."
owner = "fava"
nearest_nostr = "none"
distinction = "Nostr defines protocol messages, not an application's assembled client lifecycle."
symbols = ["fava::Fava", "fava::FavaBuilder", "fava::BuildError"]
crates = ["fava"]
spec_crates = ["fava-ffi", "fava-runtime", "fava-session", "fava-standard"]

[[term]]
name = "Query"
source = "fava"
meaning = "A valid declarative request for events with acquisition, relay access, freshness, ordering, and result rules."
owner = "fava-query"
nearest_nostr = "Filter"
distinction = "A Filter is relay wire demand; a Query also governs local sources, relay acquisition, evidence authority, ordering, and bounds."
symbols = [
    "fava_query::FilterSelection",
    "fava_query::QueryAcquisition",
    "fava_query::ResultAuthority",
    "fava_query::QuerySourcePolicy",
    "fava_query::Freshness",
    "fava_query::QueryOrdering",
    "fava_query::Query",
    "fava_query::QueryError",
]
crates = ["fava-query"]
spec_symbols = ["QueryRouting", "Selection", "ValueSet"]

[[term]]
name = "QuerySource"
source = "fava"
meaning = "A local owner that supplies one complete current event contribution and later replacement snapshots for a Query."
owner = "fava-query"
nearest_nostr = "Subscription"
distinction = "A Nostr Subscription is relay work; a QuerySource exposes independently owned local state such as an event cache or write store."
symbols = [
    "fava_query::SourceKind",
    "fava_query::SourceRevision",
    "fava_query::SourceEvent",
    "fava_query::SourceSnapshot",
    "fava_query::SourceStatus",
    "fava_query::SourceChangeFuture",
    "fava_query::SourceChanges",
    "fava_query::OpenedQuerySource",
    "fava_query::QuerySource",
    "fava_query::QuerySourceError",
    "fava_query::QuerySourceClosed",
]
crates = []

[[term]]
name = "EventRecord"
source = "fava"
meaning = "An event together with the relay and local-publication evidence Fava currently knows about it."
owner = "fava-query"
nearest_nostr = "Event"
distinction = "An Event is the protocol object; EventRecord adds local evidence without changing the event."
symbols = ["fava_query::EventRecord"]
crates = []

[[term]]
name = "QuerySnapshot"
source = "fava"
meaning = "One complete immutable answer delivered for an open Query revision."
owner = "fava-query"
nearest_nostr = "EVENT and EOSE messages"
distinction = "Relay messages are source facts; a QuerySnapshot is the merged application-visible current answer."
symbols = [
    "fava_query::QueryEvidence",
    "fava_query::SourceEvidence",
    "fava_query::QueryRevision",
    "fava_query::QuerySnapshot",
]
crates = []
spec_symbols = ["QueryChange"]

[[term]]
name = "QueryEvaluator"
source = "fava"
meaning = "The replaceable algorithm that evaluates one Query over complete current QuerySource snapshots."
owner = "fava-query"
nearest_nostr = "Filter matching"
distinction = "Nostr filter matching covers relay events; query evaluation also merges independent local sources and evidence."
symbols = [
    "fava_query::QueryEvaluator",
    "fava_query::QueryEvaluationError",
    "fava_query_standard::StandardQueryEvaluator",
]
crates = ["fava-query-standard"]

[[term]]
name = "Observation"
source = "fava"
meaning = "The lifecycle and application handle of one opened Query."
owner = "fava-observe"
nearest_nostr = "Subscription"
distinction = "An Observation merges local and relay sources and delivers current QuerySnapshots; it is not one relay subscription."
symbols = [
    "fava_observe::Observer",
    "fava_observe::Observation",
    "fava_observe::ObserveError",
    "fava_observe::ObservationClosed",
]
crates = ["fava-observe"]

[[term]]
name = "RelayAccess"
source = "fava"
meaning = "The stable authorization identity under which relay work occurs."
owner = "fava-state"
nearest_nostr = "NIP-42 authentication"
distinction = "NIP-42 defines authentication messages; RelayAccess identifies the isolated authorization used by queries and relay sessions."
symbols = ["fava_state::RelayAccess", "fava_state::RelaySessionKey"]
crates = []

[[term]]
name = "RelayEvidence"
source = "fava"
meaning = "The exact relay sessions and admission times from which Fava received one event."
owner = "fava-state"
nearest_nostr = "EVENT message"
distinction = "An EVENT message carries an event; RelayEvidence records which attributed sessions actually supplied it locally."
symbols = [
    "fava_state::RelayObservation",
    "fava_state::RelayEvidence",
    "fava_state::CachedEvent",
]
crates = ["fava-state"]

[[term]]
name = "EventCoordinate"
source = "fava"
meaning = "The identity used to choose one immutable event or the current event at a replaceable coordinate."
owner = "fava-state"
nearest_nostr = "EventId and Coordinate"
distinction = "Nostr uses EventId for immutable events and Coordinate for replaceable events; query merging needs one ordered key over both."
symbols = ["fava_state::EventCoordinate"]
crates = []

[[term]]
name = "CacheMutation"
source = "fava"
meaning = "One atomic event-cache insertion, evidence merge, or retraction decided by Nostr event-state rules."
owner = "fava-state"
nearest_nostr = "Event"
distinction = "Nostr defines events; CacheMutation carries the local atomic change an EventCache must commit."
symbols = ["fava_state::CacheMutation"]
crates = []
spec_symbols = ["EventStateDecision"]

[[term]]
name = "EventCache"
source = "fava"
meaning = "Storage for signed events observed from relays and their RelayEvidence."
owner = "fava-event-cache"
nearest_nostr = "Event"
distinction = "Nostr defines events but not client retention, eviction, persistence, or coherent local observation."
symbols = [
    "fava_event_cache::EventCache",
