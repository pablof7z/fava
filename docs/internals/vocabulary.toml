[[term]]
name = "PublishAs"
source = "fava"
meaning = "An inert borrowed application scope that selects the exact author for one replaceable-event edit publication."
owner = "fava facade"
nearest_nostr = "Event pubkey and signature"
distinction = "Nostr events carry an author after construction; PublishAs exists before an edit payload is named, accepts only ReplaceableEventEdit, and owns no signing or publication lifecycle."
counterexample = "Dropping fava.by(author) creates no write, receipt, provider call, or relay work; an accepted Write always has durable custody."
lifecycle = "Fava::by creates the borrowed handle; PublishAs::publish or PublishAs::to consumes it, otherwise it is dropped without effects; it is never stored or serialized."
forcing_requirement = "WRITE-003 forbids a parallel author field from contradicting event identity, so unsigned and presigned events must be excluded from signer scope by the Rust type surface."
falsifier = "The PublishAs compile-fail doctests must fail if signer-scoped publication accepts UnsignedEvent or Event."
symbols = ["fava::PublishAs"]
crates = []

[[term]]
name = "PublishTo"
source = "fava"
meaning = "An inert borrowed application scope that validates and selects an exact ordered explicit relay route before one publication payload is named."
owner = "fava facade"
nearest_nostr = "Relay URL"
distinction = "WriteRouting is the durable routing fact of an accepted intent; PublishTo is a pre-payload narrowing that owns no custody, receipt, route acquisition, or transport work."
counterexample = "Dropping fava.to([relay]) leaves the write store and every provider untouched; accepting through the handle creates a Write whose receipt retains the selected route."
lifecycle = "Fava::to validates and creates the borrowed handle; PublishTo::publish or PublishTo::by consumes it, otherwise it is dropped without effects; it is never stored or serialized."
forcing_requirement = "WRITE-011 requires ordinary automatic routing plus an exact explicit mode without placing routing syntax on every publish call or introducing an options bag."
falsifier = "The publication_scopes_are_inert_before_valid_payload test must observe zero custody and provider effects when a PublishTo is dropped or its relay input is invalid."
symbols = ["fava::PublishTo"]
crates = []

[[term]]
name = "WriteIntent"
source = "fava"
meaning = "A neutral checked request carrying a publication payload and durable routing fact between publication and write-store contracts."
owner = "fava-write"
nearest_nostr = "EVENT message"
distinction = "An EVENT message contains a signed event; WriteIntent coordinates neutral providers after the application has used Fava's payload-oriented publish door, and is not an application-facing facade input."
counterexample = "An application calling fava.publish(edit) receives Write without constructing WriteIntent; WriteRouting remains facade-visible only because Receipt::routing exposes that durable fact."
lifecycle = "The fava facade constructs WriteIntent privately after validating publication scopes; fava-publication and write-store providers consume and reconstruct it until the accepted obligation ends."
forcing_requirement = "Publication, rematerialization, preview, and recovery require one provider-neutral payload and route contract without exposing provider custody vocabulary as an alternate application door."
falsifier = "The facade_has_no_write_intent_compatibility_door test must fail if fava re-exports WriteIntent or WritePayload or accepts WriteIntent through Fava::publish."
symbols = [
    "fava_write::WriteIntent",
    "fava_write::WriteIntentError",
    "fava_write::WritePayload",
    "fava_write::WriteRouting",
]
crates = []
spec_symbols = ["WriteIntent", "WritePayload", "WriteRouting"]

