[package]
name = "canary"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
fava = { path = "../../crates/fava" }
fava-bookmarks = { path = "../../crates/fava-bookmarks" }
fava-event-cache = { path = "../../crates/fava-event-cache" }
fava-event-cache-memory = { path = "../../crates/fava-event-cache-memory" }
fava-delivery-standard = { path = "../../crates/fava-delivery-standard" }
fava-publisher-nip01 = { path = "../../crates/fava-publisher-nip01" }
fava-query = { path = "../../crates/fava-query" }
fava-query-standard = { path = "../../crates/fava-query-standard" }
fava-router-app-relays = { path = "../../crates/fava-router-app-relays" }
fava-router-fallback-relays = { path = "../../crates/fava-router-fallback-relays" }
fava-router-hints = { path = "../../crates/fava-router-hints" }
fava-router-outbox = { path = "../../crates/fava-router-outbox" }
fava-router-testkit = { path = "../../crates/fava-router-testkit" }
fava-routing = { path = "../../crates/fava-routing" }
fava-state = { path = "../../crates/fava-state" }
fava-signer = { path = "../../crates/fava-signer" }
fava-signer-local = { path = "../../crates/fava-signer-local" }
fava-simple-groups = { path = "../../crates/fava-simple-groups" }
fava-subscriptions-no-grouping = { path = "../../crates/fava-subscriptions-no-grouping" }
fava-subscriptions-standard = { path = "../../crates/fava-subscriptions-standard" }
fava-subscriptions = { path = "../../crates/fava-subscriptions" }
fava-transport = { path = "../../crates/fava-transport" }
fava-transport-websocket = { path = "../../crates/fava-transport-websocket" }
fava-ingest = { path = "../../crates/fava-ingest" }
fava-nip02 = { path = "../../crates/fava-nip02" }
fava-publisher = { path = "../../crates/fava-publisher" }
fava-wire = { path = "../../crates/fava-wire" }
fava-write = { path = "../../crates/fava-write" }
fava-write-store-memory = { path = "../../crates/fava-write-store-memory" }
fava-write-store-redb = { path = "../../crates/fava-write-store-redb" }
fava-write-store = { path = "../../crates/fava-write-store" }
futures-util = "=0.3.34"
hex = "=0.4.3"
nostr = { version = "=0.45.3", default-features = false, features = ["os-rng", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
secp256k1 = "=0.30.0"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "=0.30.0"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
