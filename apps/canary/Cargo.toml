[package]
name = "nmp-e2e-canary"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
futures-util = "=0.3.34"
hex = "=0.4.3"
nostr = { version = "=0.45.3", default-features = false, features = ["os-rng", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "=0.30.0"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
