[package]
name = "e2e-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
fava = { path = "../../../crates/fava" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
zeroize = "=1.9.0"
rpassword = "=7.4.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
