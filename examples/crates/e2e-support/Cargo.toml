[package]
name = "e2e-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
fava = { path = "../../../crates/fava" }
fava-signer-local = { path = "../../../crates/fava-signer-local" }
nostr = { version = "=0.45.3", default-features = false, features = ["os-rng", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

[dev-dependencies]
fava-query-standard = { path = "../../../crates/fava-query-standard" }
fava-write-store-memory = { path = "../../../crates/fava-write-store-memory" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
